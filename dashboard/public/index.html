<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<title>WIG PM Bots and Apps Gantt</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #F7F6F3;
    color: #1A1A18;
    margin: 0;
    padding: 24px;
  }
  h1 { font-size: 20px; font-weight: 500; margin: 0 0 4px; }
  .subtitle { color: #6B6A66; font-size: 13px; margin: 0 0 20px; }
  .empty-state { padding: 40px; text-align: center; color: #9B9A96; }
  .category-label {
    font-size: 12px; color: #9B9A96; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.03em;
    margin: 20px 0 8px;
  }
  .app-block { margin-bottom: 4px; }
  .row { display: flex; align-items: center; min-height: 30px; }
  .row-name { width: 180px; padding-right: 12px; font-size: 13px; font-weight: 500; flex-shrink: 0; line-height: 1.4; padding-top: 4px; }
  .row-sublabel { width: 180px; padding-right: 12px; font-size: 11px; color: #B4B2A9; flex-shrink: 0; }
  .row-track { flex: 1; position: relative; height: 24px; }
  .axis { display: flex; margin-left: 180px; margin-bottom: 4px; position: relative; height: 16px; }
  .axis span { position: absolute; font-size: 10px; color: #B4B2A9; transform: translateX(-50%); }
  .today-line { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1.5px dashed #B4B2A9; z-index: 1; }
  .grid-wrap { position: relative; }
  .segment {
    position: absolute; height: 100%; display: flex; align-items: center;
    padding-left: 8px; font-size: 11px; font-weight: 500;
    overflow: hidden; white-space: nowrap; border-radius: 6px;
  }
  .segment.plan { opacity: 0.85; border: 1px dashed rgba(60,52,137,0.4); }
  .segment .people { position: absolute; top: -15px; left: 8px; font-size: 10px; color: #9B9A96; white-space: nowrap; }
</style>
</head>
<body>
  <h1>WIG PM Bots and Apps Gantt</h1>
  <p class="subtitle" id="subtitle">Завантаження...</p>
  <div style="display:flex; gap:16px; margin-bottom:16px; font-size:12px; color:#6B6A66;">
    <span><span style="display:inline-block; width:10px; height:10px; border-radius:3px; background:#E1F5EE; margin-right:4px;"></span>Факт - в роботі</span>
    <span><span style="display:inline-block; width:10px; height:10px; border-radius:3px; background:#FAECE7; margin-right:4px;"></span>Факт - пауза</span>
    <span><span style="display:inline-block; width:10px; height:10px; border-radius:3px; background:#EEEDFE; border:1px dashed rgba(60,52,137,0.4); margin-right:4px;"></span>План</span>
  </div>
  <div id="content"></div>

<script>
async function load() {
  const res = await fetch('/api/gantt');
  const data = await res.json();
  const content = document.getElementById('content');
  const subtitle = document.getElementById('subtitle');

  if (!data.rangeStart || !data.apps.length) {
    subtitle.textContent = 'Ще немає даних';
    content.innerHTML = '<div class="empty-state">Дані з\'являться, коли команда почне логувати прогрес через /app-progress або /app-plan в Slack.</div>';
    return;
  }

  subtitle.textContent = data.rangeStart + ' — ' + data.rangeEnd;

  const step = Math.max(Math.ceil(data.totalDays / 20), 1);
  let axisHtml = '<div class="axis">';
  for (let d = 0; d <= data.totalDays; d += step) {
    const pct = (d / data.totalDays) * 100;
    const date = new Date(data.rangeStart);
    date.setDate(date.getDate() + d);
    const label = String(date.getDate()).padStart(2, '0') + '.' + String(date.getMonth() + 1).padStart(2, '0');
    axisHtml += '<span style="left:' + pct + '%">' + label + '</span>';
  }
  axisHtml += '</div>';

  const today = new Date().toISOString().slice(0, 10);
  const todayOffset = Math.round((new Date(today) - new Date(data.rangeStart)) / 86400000);
  const todayPct = (todayOffset / data.totalDays) * 100;

  const byCategory = {};
  data.apps.forEach(app => {
    if (!byCategory[app.category]) byCategory[app.category] = [];
    byCategory[app.category].push(app);
  });

  function renderSegments(segments, extraClass) {
    if (segments.length === 0) {
      return '<div style="color:#B4B2A9; font-size:12px;">—</div>';
    }
    return segments.map((seg) => {
      return '<div class="segment ' + extraClass + '" style="left:' + seg.leftPct + '%; width:' + seg.widthPct + '%; ' +
        'background:' + seg.color.bg + '; color:' + seg.color.text + ';">' +
        escapeHtml(seg.stageName) +
        (seg.employees && seg.employees.length ? '<div class="people">' + escapeHtml(seg.employees.join(', ')) + '</div>' : '') +
        '</div>';
    }).join('');
  }

  let html = axisHtml + '<div class="grid-wrap">' +
    '<div class="today-line" style="left:' + todayPct + '%;"></div>';

  for (const [category, apps] of Object.entries(byCategory)) {
    html += '<div class="category-label">' + escapeHtml(category) + '</div>';
    apps.forEach(app => {
      html += '<div class="app-block">';
      const assigneesText = (app.assignees || []).length
        ? '<div style="font-size:11px; color:#9B9A96; font-weight:400;">' + escapeHtml(app.assignees.join(', ')) + '</div>'
        : '';
      html += '<div class="row"><div class="row-name">' + escapeHtml(app.name) + assigneesText + '</div><div class="row-track">' +
        renderSegments(app.segments, '') + '</div></div>';
      html += '<div class="row"><div class="row-sublabel">План</div><div class="row-track">' +
        renderSegments(app.planSegments || [], 'plan') + '</div></div>';
      html += '</div>';
    });
  }
  html += '</div>';

  content.innerHTML = html;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

load();
</script>
</body>
</html>
