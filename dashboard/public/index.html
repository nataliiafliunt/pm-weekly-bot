<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<title>WIG PM Bots and Apps Gantt</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #F7F6F3;
    color: #1A1A18;
    margin: 0;
    padding: 24px;
  }
  h1 { font-size: 20px; font-weight: 500; margin: 0 0 4px; }
  .subtitle { color: #6B6A66; font-size: 13px; margin: 0 0 20px; }
  .empty-state { padding: 40px; text-align: center; color: #9B9A96; }
  .category-label {
    font-size: 12px; color: #9B9A96; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.03em;
    margin: 20px 0 8px;
  }
  .scroll-wrap { overflow-x: auto; padding-bottom: 8px; }
  .timeline-inner { position: relative; }
  .app-block { margin-bottom: 4px; }
  .row { display: flex; align-items: center; min-height: 30px; }
  .row-name {
    width: 180px; padding-right: 12px; font-size: 13px; font-weight: 500; flex-shrink: 0;
    line-height: 1.4; padding-top: 4px;
  }
  .row-sublabel {
    width: 180px; padding-right: 12px; font-size: 11px; color: #B4B2A9; flex-shrink: 0;
  }
  .row-track { position: relative; height: 24px; }
  .segment.plan { border: 1px dashed rgba(91,91,91,0.4); }
  .today-line .today-label {
    position: absolute; top: -18px; left: 4px; font-size: 10px; color: #6B6A66; white-space: nowrap;
  }
  .axis { display: flex; margin-left: 180px; margin-bottom: 4px; position: relative; height: 16px; }
  .axis span { position: absolute; font-size: 10px; color: #B4B2A9; transform: translateX(-50%); }
  .today-line { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1.5px dashed #B4B2A9; z-index: 1; }
  .grid-wrap { position: relative; margin-left: 180px; }
  .segment {
    position: absolute; height: 100%; display: flex; align-items: center;
    padding-left: 8px; font-size: 11px; font-weight: 500;
    overflow: hidden; white-space: nowrap; border-radius: 6px;
  }
  .segment .people { position: absolute; top: -15px; left: 8px; font-size: 10px; color: #9B9A96; white-space: nowrap; }
</style>
</head>
<body>
  <h1>WIG PM Bots and Apps Gantt</h1>
  <p class="subtitle" id="subtitle">Завантаження...</p>
  <div style="display:flex; gap:16px; margin-bottom:16px; font-size:12px; color:#6B6A66;">
    <span><span style="display:inline-block; width:10px; height:10px; border-radius:3px; background:#E1F5EE; margin-right:4px;"></span>Факт - в роботі</span>
    <span><span style="display:inline-block; width:10px; height:10px; border-radius:3px; background:#FAECE7; margin-right:4px;"></span>Факт - пауза</span>
    <span><span style="display:inline-block; width:10px; height:10px; border-radius:3px; background:#E9E9E9; border:1px dashed rgba(91,91,91,0.4); margin-right:4px;"></span>План</span>
  </div>
  <div class="scroll-wrap"><div id="content" class="timeline-inner"></div></div>

<script>
const DAY_WIDTH = 28; // px - фіксований розмір одного дня, не залежить від кількості даних

async function load() {
  const res = await fetch('/api/gantt');
  const data = await res.json();
  const content = document.getElementById('content');
  const subtitle = document.getElementById('subtitle');

  if (!data.rangeStart || !data.apps.length) {
    subtitle.textContent = 'Ще немає даних';
    content.innerHTML = '<div class="empty-state">Дані з\'являться, коли команда почне логувати прогрес через /app-progress або /app-plan в Slack.</div>';
    return;
  }

  subtitle.textContent = data.rangeStart + ' — ' + data.rangeEnd;

  const timelineWidthPx = data.totalDays * DAY_WIDTH;
  const step = 2; // підпис раз на 2 дні - при 28px на день цього достатньо, щоб не злипалось

  let axisHtml = '<div class="axis" style="width:' + (180 + timelineWidthPx) + 'px;">';
  for (let d = 0; d <= data.totalDays; d += step) {
    const px = d * DAY_WIDTH;
    const date = new Date(data.rangeStart);
    date.setDate(date.getDate() + d);
    const label = String(date.getDate()).padStart(2, '0') + '.' + String(date.getMonth() + 1).padStart(2, '0');
    axisHtml += '<span style="left:' + px + 'px">' + label + '</span>';
  }
  axisHtml += '</div>';

  const today = new Date().toISOString().slice(0, 10);
  const todayOffsetDays = Math.round((new Date(today) - new Date(data.rangeStart)) / 86400000);
  const todayPx = todayOffsetDays * DAY_WIDTH;

  // Окрема строка для підпису "Сьогодні" - НЕ в один рядок з датами,
  // щоб текст не наїжджав, коли сьогодні близько до початку діапазону.
  const todayLabelRow = '<div style="position:relative; margin-left:180px; height:14px; margin-bottom:2px;">' +
    '<span style="position:absolute; left:' + todayPx + 'px; font-size:10px; color:#2D6CDF; font-weight:600; transform:translateX(-50%); white-space:nowrap;">▲ Сьогодні</span></div>';

  const byCategory = {};
  data.apps.forEach(app => {
    if (!byCategory[app.category]) byCategory[app.category] = [];
    byCategory[app.category].push(app);
  });

  function renderSegments(segments, extraClass) {
    if (segments.length === 0) {
      return '<div style="color:#B4B2A9; font-size:12px; padding-left:4px;">—</div>';
    }
    return segments.map((seg) => {
      const left = seg.startOffsetDays * DAY_WIDTH;
      const width = Math.max(seg.lengthDays * DAY_WIDTH - 2, DAY_WIDTH - 2);
      return '<div class="segment ' + extraClass + '" style="left:' + left + 'px; width:' + width + 'px; ' +
        'background:' + seg.color.bg + '; color:' + seg.color.text + ';">' +
        escapeHtml(seg.stageName) +
        (seg.employees && seg.employees.length ? '<div class="people">' + escapeHtml(seg.employees.join(', ')) + '</div>' : '') +
        '</div>';
    }).join('');
  }

  const gridBg = 'background-image: repeating-linear-gradient(to right, rgba(0,0,0,0.07) 0, rgba(0,0,0,0.07) 1px, transparent 1px, transparent ' + DAY_WIDTH + 'px);';

  let html = axisHtml + todayLabelRow;

  for (const [category, apps] of Object.entries(byCategory)) {
    html += '<div class="category-label">' + escapeHtml(category) + '</div>';
    apps.forEach(app => {
      html += '<div class="app-block">';
      const assigneesText = (app.assignees || []).length
        ? '<div style="font-size:11px; color:#9B9A96; font-weight:400;">' + escapeHtml(app.assignees.join(', ')) + '</div>'
        : '';
      html += '<div class="row"><div class="row-name">' + escapeHtml(app.name) + assigneesText + '</div>' +
        '<div class="row-track" style="width:' + timelineWidthPx + 'px; ' + gridBg + '">' + renderSegments(app.segments, '') + '</div></div>';
      html += '<div class="row"><div class="row-sublabel">План</div>' +
        '<div class="row-track" style="width:' + timelineWidthPx + 'px; ' + gridBg + '">' + renderSegments(app.planSegments || [], 'plan') + '</div></div>';
      html += '</div>';
    });
  }

  html += '<div class="today-line" style="left:' + (180 + todayPx) + 'px; top:0; bottom:0;"></div>';

  content.innerHTML = html;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

load();
</script>
</body>
</html>
