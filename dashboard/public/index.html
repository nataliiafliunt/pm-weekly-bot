<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<title>Прогрес по додатках</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #F7F6F3;
    color: #1A1A18;
    margin: 0;
    padding: 24px;
  }
  h1 { font-size: 20px; font-weight: 500; margin: 0 0 4px; }
  .subtitle { color: #6B6A66; font-size: 13px; margin: 0 0 20px; }
  .empty-state { padding: 40px; text-align: center; color: #9B9A96; }
  .category-label {
    font-size: 12px; color: #9B9A96; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.03em;
    margin: 20px 0 8px;
  }
  .row { display: flex; align-items: center; height: 52px; }
  .row-name { width: 180px; padding-right: 12px; font-size: 13px; font-weight: 500; flex-shrink: 0; }
  .row-track { flex: 1; position: relative; height: 34px; }
  .axis { display: flex; margin-left: 180px; margin-bottom: 4px; position: relative; height: 16px; }
  .axis span { position: absolute; font-size: 10px; color: #B4B2A9; transform: translateX(-50%); }
  .grid-wrap { position: relative; }
  .segment {
    position: absolute; height: 100%; display: flex; align-items: center;
    padding-left: 8px; font-size: 12px; font-weight: 500;
    overflow: hidden; white-space: nowrap;
  }
  .segment .people { position: absolute; top: -16px; left: 8px; font-size: 11px; color: #9B9A96; white-space: nowrap; }
  .stripes {
    background-image: repeating-linear-gradient(
      45deg, transparent, transparent 4px,
      rgba(0,0,0,0.10) 4px, rgba(0,0,0,0.10) 8px
    );
  }
</style>
</head>
<body>
  <h1>Прогрес по додатках</h1>
  <p class="subtitle" id="subtitle">Завантаження...</p>
  <div id="content"></div>

<script>
async function load() {
  const res = await fetch('/api/gantt');
  const data = await res.json();
  const content = document.getElementById('content');
  const subtitle = document.getElementById('subtitle');

  if (!data.rangeStart || !data.apps.length) {
    subtitle.textContent = 'Ще немає даних';
    content.innerHTML = '<div class="empty-state">Дані з\'являться, коли команда почне логувати прогрес через /app-progress в Slack.</div>';
    return;
  }

  subtitle.textContent = data.rangeStart + ' — ' + data.rangeEnd;

  // Ось по днях, підпис - раз на N днів, щоб не було затісно
  const step = Math.max(Math.ceil(data.totalDays / 20), 1);
  let axisHtml = '<div class="axis">';
  for (let d = 0; d <= data.totalDays; d += step) {
    const pct = (d / data.totalDays) * 100;
    const date = new Date(data.rangeStart);
    date.setDate(date.getDate() + d);
    const label = String(date.getDate()).padStart(2, '0') + '.' + String(date.getMonth() + 1).padStart(2, '0');
    axisHtml += '<span style="left:' + pct + '%">' + label + '</span>';
  }
  axisHtml += '</div>';

  const byCategory = {};
  data.apps.forEach(app => {
    if (!byCategory[app.category]) byCategory[app.category] = [];
    byCategory[app.category].push(app);
  });

  let html = axisHtml + '<div class="grid-wrap">';
  for (const [category, apps] of Object.entries(byCategory)) {
    html += '<div class="category-label">' + escapeHtml(category) + '</div>';
    apps.forEach(app => {
      html += '<div class="row"><div class="row-name">' + escapeHtml(app.name) + '</div><div class="row-track">';
      if (app.segments.length === 0) {
        html += '<div style="color:#B4B2A9; font-size:13px;">—</div>';
      } else {
        app.segments.forEach((seg, idx) => {
          const radiusLeft = idx === 0 ? '8px' : '0';
          const radiusRight = idx === app.segments.length - 1 ? '8px' : '0';
          const stripeClass = seg.paused ? ' stripes' : '';
          const peopleHtml = seg.employees.length
            ? '<div class="people">' + escapeHtml(seg.employees.join(', ')) + '</div>'
            : '';
          html += '<div class="segment' + stripeClass + '" style="left:' + seg.leftPct + '%; width:' + seg.widthPct + '%; ' +
            'border-radius:' + radiusLeft + ' ' + radiusRight + ' ' + radiusRight + ' ' + radiusLeft + ';' +
            'background:' + seg.color.bg + '; color:' + seg.color.text + ';">' +
            escapeHtml(seg.stageName) + peopleHtml +
            '</div>';
        });
      }
      html += '</div></div>';
    });
  }
  html += '</div>';

  content.innerHTML = html;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

load();
</script>
</body>
</html>
